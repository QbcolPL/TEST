name: Source Gate
on:
  workflow_dispatch:
  push:
    branches: [main, 'release/**']
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tests/source_gate.py
